dist: jammy
language: python
python:
  - "3.12"

install:
  - pip install -r requirements.txt

script:
  - black --check .
  - flake8 .
  - coverage run --source=mysite,polls manage.py test

after_success:
  - coveralls

deploy:
  provider: elasticbeanstalk
  edge: true
  access_key_id: $AWS_ACCESS_KEY_ID
  secret_access_key: $AWS_SECRET_ACCESS_KEY
  region: us-east-1
  app: swe1-app
  env: swe1-app-env
  bucket: elasticbeanstalk-us-east-1-740637886501
  on:
    branch: main